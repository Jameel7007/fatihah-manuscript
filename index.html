<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Fātiḥah 3D Manuscript — dev</title>
<style>
  html { background: #0D0906; }
  body { margin: 0; background: #0D0906; color: #A2957A; }
  #spacer { width: 1px; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; opacity: 0; }
  /* §15 designed first frame: inline LQIP blur-up under the 1600×1000 poster JPEG of R-p0.00 */
  #poster { position: fixed; inset: 0; z-index: 2; background: #0D0906 center / cover no-repeat; pointer-events: none; }
  #poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #hud {
    position: fixed; left: 16px; bottom: calc(14px + env(safe-area-inset-bottom));
    font: 11px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .08em;
    text-transform: uppercase; color: #A2957A; user-select: none; pointer-events: none;
  }
  #bar {
    position: fixed; top: 0; right: calc(6px + env(safe-area-inset-right));
    width: 2px; height: 0; background: #C9A45B; opacity: .35;
  }
  #cap {
    position: fixed; left: 16px; top: 14px; display: none;
    font: 11px/1.6 ui-monospace, Menlo, monospace; color: #C9A45B; white-space: pre;
  }
  body.capture { overflow: hidden; }
  body.capture #hud, body.capture #bar, body.capture #poster { display: none; }
  body.capture canvas#gl { opacity: 1; }
  body.capture #cap { display: block; }
  /* capture buffer is a fixed 1440×900 (or per-params) — scale the VIEW to fit the window;
     readback uses the buffer, so hashes are unaffected */
  body.capture canvas#gl { inset: auto; left: 0; top: 0; width: 100vw !important; height: auto !important; max-height: 100vh; object-fit: contain; }
</style>
</head>
