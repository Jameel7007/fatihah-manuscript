<!doctype html><meta charset="utf-8"><title>Targeted capture repeatability</title>
<style>body{background:#10131a;color:#eee;font:12px monospace}iframe{position:fixed;inset:0;width:100vw;height:100vh;opacity:.02;pointer-events:none}pre{position:relative;z-index:1;white-space:pre-wrap}</style>
<pre id="log">Targeted fresh-page captures (unblessed)\n</pre>
<script type="module">
const q=new URLSearchParams(location.search), rows=[], bases=new Map();
const log=document.querySelector('#log');
// Preserve completed observations even if the optional local save sink stops.
const saveErrors=[];
async function save(name,body){try{const r=await fetch(`/qa-save?name=${name}`,{method:'POST',body,signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error(`HTTP ${r.status}`);return true;}catch(error){const message=`${name}: ${String(error)}`;saveErrors.push(message);log.textContent+='SAVE FAILED '+message+'\n';return false;}}
const pixels=async dataUrl=>{const img=new Image();img.src=dataUrl;await img.decode();const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);return ctx.getImageData(0,0,c.width,c.height).data;};
const cases=q.has('sequence')?[1,2,3].flatMap(tier=>[0,.08,.21,.34,.45,.56,.645,.710,.76,.86,.93,1].map(p=>[p,tier,tier===1?1440:390,tier===1?900:844])):[[.645,1,1440,900],[.76,2,390,844],[.93,2,390,844]];
for(let repeat=0;repeat<(q.has('sequence')?2:8);repeat++)for(const [p,tier,w,h] of cases){
 const f=document.createElement('iframe');f.src=`/?capture=${p}&tier=${tier}&w=${w}&h=${h}&warm=${q.get('warm')||15}${q.has('noshadow')?'&noshadow':''}${q.has('gpuReadback')?'&gpuReadback':''}${q.has('traceSources')?'&traceSources':''}${q.has('noenv')?'&noenv':''}${q.has('nomsaa')?'&nomsaa':''}${q.has('gpuTrace')?'&gpuTrace':''}&repeat=${repeat}`;document.body.append(f);
 let c;for(let i=0;i<240;i++){await new Promise(r=>setTimeout(r,250));c=f.contentWindow?.__capture;if((c&&(!(q.has('traceSources')||q.has('gpuTrace'))||c.sources))||f.contentWindow?.__captureError)break;}
 const key=`${p}-T${tier}`,row={key,repeat,hash:c?.hash||'TIMEOUT',error:f.contentWindow?.__captureError,sources:c?.sources};
 if(c){const d=await pixels(c.dataUrl);if(!bases.has(key))bases.set(key,{hash:c.hash,d,dataUrl:c.dataUrl});const b=bases.get(key);row.changedPixels=0;row.maxDelta=0;row.bounds=[w,h,-1,-1];for(let i=0;i<d.length;i+=4){let changed=false;for(let k=0;k<4;k++){const delta=Math.abs(d[i+k]-b.d[i+k]);row.maxDelta=Math.max(row.maxDelta,delta);changed ||= delta>0;}if(changed){row.changedPixels++;const x=i/4%w,y=Math.floor(i/4/w);row.bounds=[Math.min(row.bounds[0],x),Math.min(row.bounds[1],y),Math.max(row.bounds[2],x),Math.max(row.bounds[3],y)];}}
  if(q.has('saveDiff')&&row.changedPixels){
   const prefix=`v166-diff-${key}-${Date.now()}`;
   const mask=new ImageData(w,h);
   for(let i=0;i<d.length;i+=4){const changed=[0,1,2,3].some(k=>d[i+k]!==b.d[i+k]);mask.data[i]=changed?255:0;mask.data[i+1]=changed?64:0;mask.data[i+3]=255;}
   const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').putImageData(mask,0,0);
   row.evidence={baselineHash:b.hash,baseline:`${prefix}-baseline.png`,repeat:`${prefix}-repeat.png`,mask:`${prefix}-mask.png`,maskNote:'Orange means any raw RGBA difference; display diagnostic only, not a capture or blessed hash'};
   for(const [suffix,url] of [['baseline',b.dataUrl],['repeat',c.dataUrl],['mask',canvas.toDataURL('image/png')]]){
    const saved=await save(`${prefix}-${suffix}`,await (await fetch(url)).blob());
    (row.evidence.saved??={})[suffix]=saved;
   }
  }
 }
 rows.push(row);log.textContent+=JSON.stringify({...row,sources:row.sources?`${Object.keys(row.sources).length} input hashes`:undefined})+'\n';f.remove();
}
const out={date:new Date().toISOString(),options:location.search,warm:q.get('warm')||15,noshadow:q.has('noshadow'),rows,saveErrors};
window.__repeatResult=out;
const result=await save('v166-targeted-'+(q.has('gpuReadback')?'gpu-':'')+(q.has('sequence')?'sequence-':'')+(q.has('noshadow')?'noshadow':'normal')+'-'+(q.get('warm')||15)+'-'+Date.now(),JSON.stringify(out,null,2));
log.textContent+='COMPLETE '+(result?'report saved':'REPORT NOT SAVED; window.__repeatResult retained');
</script>
